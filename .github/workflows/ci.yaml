name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Run tests
        run: cargo test --locked
      - name: Exercise the real workspace TUI
        if: runner.os == 'Linux'
        run: |
          cargo build --locked
          python3 scripts/test-workspace.py
          python3 scripts/test-network.py
          python3 scripts/test-stash.py
          python3 scripts/test-changes.py
          python3 scripts/test-recovery.py
          python3 scripts/test-integrate.py
          python3 scripts/test-commit-operations.py
          python3 scripts/test-history.py
          python3 scripts/test-layout.py
          python3 scripts/test-tabs.py
          python3 scripts/test-polish.py
          python3 scripts/test-detail.py
          python3 scripts/test-composer.py
          python3 scripts/test-tree-workflow.py

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
