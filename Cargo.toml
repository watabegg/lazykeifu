[package]
name = "lazykeifu"
version = "0.1.4"
edition = "2021"
description = "A graph-first Git TUI with lazygit-inspired workflows"
license = "MIT"
authors = ["trasta298", "watabegg"]
repository = "https://github.com/watabegg/lazykeifu"
include = ["src/**", "locales/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
readme = "README.md"
keywords = ["git", "tui", "cli", "graph", "visualization"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lzkf"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"

# Git
git2 = { version = "0.19", features = ["vendored-openssl"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utils
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"

# Diff
similar = { version = "2.7", features = ["inline"] }

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = ["default-onig"] }

# Search
fuzzy-matcher = "0.3"

# Config
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"

# Debug / logging
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3.17"
